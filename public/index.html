<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
/* no-FOUC theme pre-stamp: resolve auto|light|dark and stamp <html> before first paint */
(function(){try{var p=localStorage.getItem('clideck.theme');
if(p!=='light'&&p!=='dark')p=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.documentElement.setAttribute('data-theme',p);}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();
/* no-flash sidebar-width pre-stamp (E1): apply the saved --sidebar-w before first paint */
(function(){try{var w=parseInt(localStorage.getItem('clideck.sidebarW'),10);
if(w>=240&&w<=560)document.documentElement.style.setProperty('--sidebar-w',w+'px');}catch(e){}})();
</script>
<title>CliDeck</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<!-- stale/outdated-engine banner — shown by ws.js after repeated instant socket closes (see store 'stale' event) -->
<div class="engine-banner" id="engine-banner" role="alert" hidden>
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
  <span id="engine-banner-text"></span>
</div>
<div class="app">
  <!-- ══════════ SIDEBAR ══════════ -->
  <aside class="sidebar">
    <div class="side-head">
      <div class="brand"><div class="brand-mark"></div><div class="brand-name">clideck <span>v2</span></div></div>
      <div class="head-actions">
        <button class="proj-btn" id="proj-btn" title="New project" aria-label="New project">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
        </button>
        <div class="new-wrap"><button class="new-btn" id="new-btn" title="New session">+</button></div>
      </div>
    </div>
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
      <input id="search" placeholder="Search sessions" autocomplete="off" spellcheck="false">
      <button class="search-clear" id="search-clear" title="Clear search" aria-label="Clear search">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="tabs">
      <div class="tab on" id="tab-all">All</div>
      <div class="tab" id="tab-unread">Unread <span class="cnt zero" id="unread-cnt">0</span></div>
    </div>
    <button class="project-help" id="team-help-btn" type="button" aria-haspopup="dialog">How agents work together</button>
    <div class="list" id="list">
      <div class="list-empty" id="list-empty">Connecting to the engine…</div>
    </div>
    <div class="side-foot">
      <!-- Neutral until the About me profile names someone: sidebar.js repaints both on every config. -->
      <div class="av">y</div><span class="who">You · local</span>
      <span class="conn down" id="conn"><i></i><span id="conn-text">offline</span></span>
      <span class="save-ind" id="save-ind" title="Sessions saved" aria-hidden="true">
        <svg class="si-spin" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></svg>
        <svg class="si-check" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        <svg class="si-off" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="9"/></svg>
      </span>
      <button class="foot-btn" id="prompts-btn" title="Prompt library — type // in any terminal" aria-label="Prompt library">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h8"/><path d="M7 13h5"/></svg>
      </button>
      <button class="foot-btn" id="notify-btn" title="Notifications on — click to turn off" aria-label="Turn notifications off" aria-pressed="true">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g class="notify-bell"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.5 21a1.7 1.7 0 0 1-3 0"/></g><path class="notify-slash" d="M4 4l16 16"/></svg>
      </button>
      <button class="foot-btn" id="settings-btn" title="Settings" aria-label="Settings">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button class="theme-btn" id="theme-btn" title="Theme" aria-label="Theme">◐</button>
    </div>
  </aside>

  <!-- E1: drag handle on the sidebar/terminal divider — resize (persisted) · double-click resets -->
  <div class="resize-handle" id="resize-handle" aria-label="Resize sidebar"></div>

  <!-- ══════════ RIGHT PANE ══════════ -->
  <main class="main">
    <div class="rp-empty" id="rp-empty">
      <div>
        <div class="mk"></div>
        <div class="big" id="rp-empty-big">Connecting to the engine…</div>
        <div id="rp-empty-sub">Live sessions will appear on the left.</div>
      </div>
    </div>

    <section class="rp hidden" id="rp">
      <header class="term-head" id="term-head">
        <div class="th-id">
          <div class="th-avatar" id="th-avatar"></div>
          <div class="th-name" id="th-name" role="button" tabindex="0" title="Copy ask address">Claude</div>
          <button class="th-rename" id="th-rename" title="Rename session" aria-label="Rename session">
            <svg class="th-ic pencil" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L18.5 9.5a2.12 2.12 0 0 0-3-3L5 17v3z"/><path d="M13.5 6.5l3 3"/></svg>
            <svg class="th-ic cancel" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
          </button>
          <div class="th-rename-msg" id="th-rename-msg" role="status" hidden></div>
        </div>
        <div class="th-spacer"></div>
        <div class="th-insights" role="group" aria-label="Session telemetry">
          <div class="tb-status th-pill st-closed" id="th-chip"><span class="dot offline"></span> <span>—</span></div>
          <div class="th-context th-pill" id="th-context" role="meter" aria-valuemin="0" aria-valuemax="100" hidden>
            <span class="th-context-track" aria-hidden="true"><i id="th-context-fill"></i></span>
            <span class="th-context-value" id="th-context-value"></span>
          </div>
          <div class="th-model" id="th-model"></div>
          <div class="th-last th-pill" id="th-last" hidden>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            <span id="th-last-value"></span>
          </div>
          <div class="th-meta" id="th-meta"></div>
        </div>
        <div class="th-div" aria-hidden="true"></div>
        <div class="th-actions">
          <button class="th-history" id="th-history" title="Conversation history" aria-label="Conversation history">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
          </button>
          <button class="th-voice" id="voice-mic" title="Voice input" aria-label="Voice input" aria-pressed="false">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="21"/></svg>
          </button>
          <button class="th-voice" id="voice-say" title="Read completed replies aloud" aria-label="Toggle Supertonic auto-read" aria-pressed="false">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
          </button>
          <button class="th-plugin" id="plugin-actions" title="Plugin actions" aria-label="Plugin actions" aria-haspopup="menu" aria-expanded="false" hidden>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg>
          </button>
        </div>
      </header>
      <div class="cd-tabs" id="pane-tabs" role="tablist"></div>
      <div class="pane-body" id="pane-body">
      <div class="term-frame" id="term-panel" role="tabpanel">
        <div id="term"></div>
        <button class="scroll-btn" id="scroll-btn" title="Jump to latest" aria-label="Jump to latest">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
      </div>
      </div>
    </section>
  </main>
</div>
<!-- toasts mount into a lazily-created .toaster container (public/js/ui/toast.js) -->

<!-- xterm 6 UMD (sets window.Terminal), then the ES-module app -->
<script src="/vendor/xterm.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
