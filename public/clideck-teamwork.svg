<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">The character programmer chooses the SFX agent from the FPS project team</title>
  <desc id="desc">You report that enemy voices do not fit the game. The character programmer sees teammates for maps, SFX, visual assets, story, QA, and playtesting, and chooses the SFX agent. CliDeck Ask carries the request to SFX. SFX replies that the enemy voices have changed and asks the programmer to check them. The programmer reviews the update and brings it back to you.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #272c32; }
      .heading { font-size: 24px; font-weight: 650; }
      .role { font-size: 21px; font-weight: 650; }
      .body { font-size: 23px; }
      .note { font-size: 19px; fill: #626a73; }
      .small { font-size: 17px; fill: #626a73; }
      .icon { fill: none; stroke: #49515a; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .request { fill: none; stroke: #bf6544; stroke-width: 3; marker-end: url(#request-arrow); }
      .reply { fill: none; stroke: #51856a; stroke-width: 3; marker-end: url(#reply-arrow); }
    </style>
    <marker id="request-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1 8 5 2 9" fill="none" stroke="#bf6544" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="reply-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1 8 5 2 9" fill="none" stroke="#51856a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <g id="person" class="icon"><circle cx="15" cy="10" r="8"/><path d="M1 36c0-16 28-16 28 0"/></g>
    <g id="terminal" class="icon"><rect x="1" y="2" width="32" height="27" rx="5"/><path d="m8 10 5 5-5 5m10 0h8"/></g>
  </defs>

  <rect x="1" y="1" width="1398" height="778" rx="22" fill="#faf8f3" stroke="#dedad1"/>
  <text x="35" y="50" font-size="29" font-weight="650">An FPS project</text>
  <text x="35" y="84" class="note">The character programmer chooses the teammate who can help with your request.</text>

  <!-- The full team is visible; only SFX receives this request. -->
  <rect x="930" y="112" width="438" height="610" rx="18" fill="#f1efe9" stroke="#dedad1"/>
  <text x="951" y="147" class="heading">Project team</text>
  <path d="M748 354H885M885 202V677M885 202h65M885 479h65M885 545h65M885 611h65M885 677h65" fill="none" stroke="#c8c5bd" stroke-width="2" stroke-dasharray="5 6"/>

  <rect x="950" y="173" width="398" height="58" rx="10" fill="#fffefa" stroke="#dcd8cf"/>
  <use href="#terminal" x="966" y="187"/>
  <text x="1012" y="210" class="role">Game map programmer</text>

  <rect x="950" y="250" width="398" height="179" rx="13" fill="#edf4ee" stroke="#51856a" stroke-width="2"/>
  <use href="#terminal" x="966" y="266"/>
  <text x="1012" y="285" class="role">SFX agent</text>
  <text x="1012" y="310" class="small">Claude Code</text>
  <rect x="1227" y="268" width="103" height="28" rx="14" fill="#dce9df"/>
  <text x="1278" y="288" text-anchor="middle" font-size="16" font-weight="650">CHOSEN</text>
  <text x="971" y="348" class="body">
    <tspan x="971">“I changed these enemy voices.</tspan>
    <tspan x="971" dy="31">Please check if they're better.”</tspan>
  </text>
  <path d="M973 402h4m6-7v14m7-19v24m7-16v8m7-12v16m7-8h4m6-10v20m7-15v10m7-13v16m7-8h4" fill="none" stroke="#51856a" stroke-width="2.5" stroke-linecap="round"/>

  <rect x="950" y="450" width="398" height="58" rx="10" fill="#fffefa" stroke="#dcd8cf"/>
  <use href="#terminal" x="966" y="464"/>
  <text x="1012" y="487" class="role">Visual assets agent</text>
  <rect x="950" y="516" width="398" height="58" rx="10" fill="#fffefa" stroke="#dcd8cf"/>
  <use href="#terminal" x="966" y="530"/>
  <text x="1012" y="553" class="role">Story agent</text>
  <rect x="950" y="582" width="398" height="58" rx="10" fill="#fffefa" stroke="#dcd8cf"/>
  <use href="#terminal" x="966" y="596"/>
  <text x="1012" y="619" class="role">QA agent</text>
  <rect x="950" y="648" width="398" height="58" rx="10" fill="#fffefa" stroke="#dcd8cf"/>
  <use href="#terminal" x="966" y="662"/>
  <text x="1012" y="685" class="role">Player agent</text>

  <!-- User and programmer remain the same two participants on the way back. -->
  <rect x="30" y="202" width="300" height="365" rx="17" fill="#fffefa" stroke="#d9d4ca"/>
  <use href="#person" x="49" y="222"/>
  <text x="97" y="244" class="heading">You</text>
  <text x="97" y="270" class="note">Project lead</text>
  <text x="50" y="315" class="body">
    <tspan x="50">“Some enemy voices</tspan>
    <tspan x="50" dy="32">don't fit the game.</tspan>
    <tspan x="50" dy="32">Can we improve them?”</tspan>
  </text>
  <path d="M50 411h259" stroke="#e2ded5"/>
  <text x="50" y="444" class="small">BACK TO YOU</text>
  <text x="50" y="482" class="body">
    <tspan x="50">“The voices are updated.</tspan>
    <tspan x="50" dy="32">Give them another try.”</tspan>
  </text>

  <rect x="434" y="202" width="314" height="365" rx="17" fill="#fffefa" stroke="#cfa98f" stroke-width="2"/>
  <use href="#terminal" x="454" y="222"/>
  <text x="454" y="291" class="heading">Character programmer</text>
  <text x="499" y="244" class="note">Codex</text>
  <text x="454" y="330" class="note">Chooses the SFX agent:</text>
  <text x="454" y="368" class="body">
    <tspan x="454">“Can you update these</tspan>
    <tspan x="454" dy="32">enemy voices?”</tspan>
  </text>
  <path d="M454 428h274" stroke="#e2ded5"/>
  <text x="454" y="469" class="note">
    <tspan x="454">Reviews the SFX update</tspan>
    <tspan x="454" dy="29">and brings it back to you.</tspan>
  </text>

  <!-- Numbered arrows make the round trip explicit without a protocol diagram. -->
  <text x="380" y="287" text-anchor="middle" font-size="18" font-weight="650">1 · Feedback</text>
  <path d="M335 306h93" class="request"/>
  <text x="380" y="469" text-anchor="middle" font-size="18" font-weight="650">4 · Update</text>
  <path d="M428 488h-93" class="reply"/>

  <rect x="779" y="218" width="141" height="31" rx="15" fill="#f6e1d6"/>
  <text x="849" y="240" text-anchor="middle" font-size="18" font-weight="650">CliDeck Ask</text>
  <text x="849" y="286" text-anchor="middle" font-size="18" font-weight="650">2 · Request</text>
  <path d="M754 306h190" class="request"/>
  <text x="849" y="389" text-anchor="middle" font-size="18" font-weight="650">3 · Reply</text>
  <path d="M944 409H754" class="reply"/>

  <text x="700" y="755" text-anchor="middle" class="note">CliDeck Ask carries requests and replies between your agents, across providers.</text>
</svg>
