<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#34363f"/>
      <stop offset="1" stop-color="#121317"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.78" r="0.62">
      <stop offset="0" stop-color="#e18063" stop-opacity=".34"/>
      <stop offset="1" stop-color="#e18063" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="0.3" stop-color="#fff" stop-opacity=".03"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f19a7c"/>
      <stop offset="1" stop-color="#cf6243"/>
    </linearGradient>
    <linearGradient id="faceRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="0.2" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#body)"/>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
    <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  </g>
  <!-- the deck: sessions stacked behind the one in front -->
  <rect x="318" y="246" width="388" height="300" rx="58" fill="#4a4d58" opacity=".55"/>
  <rect x="270" y="296" width="484" height="330" rx="64" fill="#5c606c" opacity=".75"/>
  <circle cx="370" cy="272" r="11" fill="#74b98f" opacity=".9"/>
  <circle cx="326" cy="326" r="12" fill="#e6b04a"/>
  <g filter="url(#cardShadow)">
    <rect x="222" y="356" width="580" height="420" rx="76" fill="url(#face)"/>
    <rect x="223.5" y="357.5" width="577" height="417" rx="74.5" fill="none" stroke="url(#faceRim)" stroke-width="3"/>
  </g>
  <!-- prompt: chevron + cursor -->
  <path d="M352 500 L452 566 L352 632" fill="none" stroke="#2a130c" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="510" y="604" width="150" height="52" rx="26" fill="#2a130c"/>
</svg>
